name: Build Windows (EPUB only)

on:
  push:
    branches:
      - feat/add-windows-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Build (EPUB only)
        run: cargo build --release --target x86_64-pc-windows-msvc --no-default-features

      - name: Package
        shell: pwsh
        run: |
          $version = (cargo metadata --format-version 1 --no-deps | ConvertFrom-Json).packages[0].version
          $target = "x86_64-pc-windows-msvc"
          $archive = "bookokrat-v${version}-${target}.zip"
          Compress-Archive -Path "target\${target}\release\bookokrat.exe" -DestinationPath "${archive}"
          Write-Output "archive=${archive}" >> $env:GITHUB_OUTPUT
        id: package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bookokrat-windows-epub
          path: bookokrat-*.zip
